name: mdBook

on:
  push:
    branches:
      - main
      - 'cursor/computational-mechanics-book-*'
      - 'cursor/unified-mechanics-book-*'
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook and mdbook-mermaid
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
          cargo install mdbook-mermaid --version 0.14.1 --locked
          mdbook-mermaid install .

      - name: Validate relative links in src/
        run: ./scripts/validate-links.sh

      - name: Validate relative links in writings/
        run: ./scripts/validate-links.sh --writings

      - name: Verify writings sync
        run: ./scripts/sync-writings.sh --check

      - name: Test parse script fixtures
        run: ./scripts/test-fixtures.sh

      - name: Build book
        run: mdbook build

      - name: Build standalone Writings mdBooks
        run: ./scripts/build-all-writings.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
