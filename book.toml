[book]
title = "Computational Mechanics"
authors = ["Hanfeng Zhai"]
description = "A continuous journey from linear algebra and functional analysis through finite element and finite volume methods to dislocation dynamics, molecular dynamics, and density functional theory."
language = "en"
multilingual = false
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
mathjax-support = true
additional-css = ["theme/custom.css"]
git-repository-url = "https://github.com/hanfengzhai/CompMechBook"

[output.html.search]
enable = true
limit-results = 30
